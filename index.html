'use strict';const $=s=>document.querySelector(s),app=$('#app'),today=()=>new Date().toLocaleDateString('en-CA'),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;try{data=JSON.parse(localStorage.getItem('playmora-v1'))||{}}catch{data={}}data={xp:0,plays:0,streak:0,bests:{},achievements:[],results:[],daily:{},sound:true,...data};let timer=null,timeout=null,game=null;function save(){localStorage.setItem('playmora-v1',JSON.stringify(data));$('#level-pill').textContent='Level '+(1+Math.floor(data.xp/300));$('#sound').textContent=data.sound?'🔊 Sound':'🔇 Sound'}function clear(){clearInterval(timer);clearTimeout(timeout);timer=timeout=null;game=null}function sound(type){if(!data.sound)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value={good:650,bad:180,win:880}[type]||520;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.14);o.start();o.stop(ctx.currentTime+.15);setTimeout(()=>ctx.close(),300)}catch{}}function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}function award(name){if(data.achievements.includes(name))return;data.achievements.push(name);toast('🏆 '+name+' unlocked!');sound('win')}function stamp(){let d=today();if(data.lastDay===d)return;const prev=new Date(d+'T12:00:00');prev.setDate(prev.getDate()-1);data.streak=data.lastDay===prev.toLocaleDateString('en-CA')?data.streak+1:1;data.lastDay=d;if(data.streak>=3)award('3-Day Streak');if(data.streak>=7)award('7-Day Streak')}function finish(kind,score,details,xp,success=true){clearInterval(timer);clearTimeout(timeout);timer=timeout=null;stamp();data.plays++;data.xp+=xp;let old=data.bests[kind];let best=kind==='reaction'?old==null||score<old:old==null||score>old;if(best)data.bests[kind]=score;data.results.unshift({kind,score,date:today()});data.results=data.results.slice(0,50);award('First Game');if(success)award('First Victory');if(best&&data.plays>1)award('New Personal Best');if(kind==='difference'&&success)award('Difference Detective');if(kind==='memory'&&success)award('Memory Master');if(kind==='reaction'&&score<250)award('Fast Reaction');if(data.plays>=25)award('25 Games Played');if(data.plays>=100)award('100 Games Played');let dk=today();if(sessionStorage.getItem('daily-play')===kind&&!data.daily[dk]){data.daily[dk]={kind,score};data.xp+=50;xp+=50;sessionStorage.removeItem('daily-play');toast('Daily Challenge complete! +50 XP')}save();sound(success?'win':'bad');let box=$('#result');if(box){box.innerHTML=`<div class="result"><h2>${success?(best?'✨ New personal best!':'🎉 Great round!'):'⏰ Time is up'}</h2><p>${safe(details)}</p><h3>Score: ${score} · +${xp} XP</h3><div class="progress"><i style="width:${data.xp%300/3}%"></i></div><div class="actions"><button class="btn" id="again">Play again</button>${kind==='difference'&&success?'<button class="btn secondary" id="next">Next level</button>':''}<button class="btn secondary" id="share">Share score</button><a class="btn ghost" href="#games">Try another game</a></div></div>`;$('#again').onclick=()=>start(kind);if($('#next'))$('#next').onclick=()=>{level=(level+1)%levels.length;start('difference')};$('#share').onclick=()=>share(kind,score)}if(kind==='difference')game=null}async function share(kind,score){let text=`I scored ${score} on ${kind==='difference'?'Find the Difference':kind==='memory'?'Memory Match':'Reaction Speed'} at Playmora. Can you beat me? ${location.href.split('#')[0]}`;try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);toast('Score copied to clipboard')}}catch{toast('Sharing cancelled')}}const cards=[['difference','🔎','Find the Difference','Spot five changes across original illustrated scenes.'],['memory','🧠','Memory Match','Flip cards, find pairs, and sharpen your recall.'],['reaction','⚡','Reaction Speed','Wait for green. Tap fast. Beat your best time.']];function card([id,icon,title,desc]){return `<article class="card"><span class="emoji">${icon}</span><h3>${title}</h3><p>${desc}</p><a class="btn" href="#${id}">Play now →</a></article>`}function view(html){app.innerHTML=html;window.scrollTo(0,0)}let level=0;const levels=[{name:'Sunny shore',theme:'beach',seconds:95,difficulty:1,changes:['sun','cloud','boat','umbrella','shell'],areas:[[84,17,9],[29,18,10],[75,54,9],[31,69,10],[69,85,9]]},{name:'Little park',theme:'park',seconds:80,difficulty:1.3,changes:['sun','cloud','bird','tree','flower'],areas:[[84,17,8],[29,18,9],[75,54,8],[31,69,9],[69,85,8]]},{name:'Night camp',theme:'camp',seconds:65,difficulty:1.7,changes:['moon','star','owl','tent','fire'],areas:[[84,17,7],[29,18,8],[75,54,7],[31,69,8],[69,85,7]]}];function scene(l,variant){let c=l.theme==='beach'?['#b9eaff','#f7dd97','#45b9d1']:l.theme==='park'?['#bceade','#9bdb80','#61ba71']:['#293057','#57618b','#464f69'];let fill=(id,a,b)=>variant&&l.changes.includes(id)?b:a;return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${l.name} ${variant?'changed':'original'} scene"><rect width="400" height="300" fill="${c[0]}"/><path d="M0 185 Q170 170 400 188 V300 H0" fill="${c[2]}"/><path d="M0 224 Q190 205 400 226 V300 H0" fill="${c[1]}"/><circle cx="336" cy="51" r="${variant?19:25}" fill="${fill('sun','#ffdf69','#fff5c0')}"/><path d="M75 57 Q83 38 103 49 Q120 30 140 51 Q164 47 166 64 Z" fill="${fill('cloud','#fff','#f7a3d5')}"/><path d="M245 156 l55 0 -14 20 -29 0z" fill="${fill('bird','#fefefe','#ef656f')}"/><path d="M270 156 l0 -33 24 30z" fill="${variant?'#ffdd6c':'#fff'}"/><path d="M118 249 V180 M118 181 Q87 169 75 203 Q111 197 118 181 Q145 170 165 201 Q128 195 118 181" stroke="#624a50" stroke-width="6" fill="${fill('tree','#67ad68','#ef9a47')}"/><path d="M210 268 l66 0 -34 -40z" fill="${fill('flower','#fd6791','#9e74e9')}"/><circle cx="276" cy="254" r="8" fill="${fill('flower','#ffe577','#8df1e4')}"/><circle cx="128" cy="255" r="7" fill="${fill('tree','#e89073','#7953a1')}"/><path d="M314 260 q20 -22 33 0 q-18 11 -33 0" fill="${fill('fire','#ff7f5c','#a6ee78')}"/><path d="M18 268 Q55 240 88 269" stroke="#ffffff99" stroke-width="5" fill="none"/></svg>`}function renderDifference(){clear();let l=levels[level];game={kind:'difference',found:new Set(),wrong:0,left:l.seconds,started:false};view(`<section class="section"><div class="game-head"><div><div class="eyebrow">Find the Difference · Level ${level+1} of ${levels.length}</div><h1>${l.name}</h1><p>Find 5 changes. Tap either picture. Correct finds appear on both.</p></div><a href="#games" class="btn ghost">All games</a></div><div class="gamebar"><span>⏳ <b id="time">${l.seconds}</b>s</span><span>🔎 <b id="found">0</b>/5</span><span>⚠️ Mistakes: <b id="mistakes">0</b></span></div><div class="board section">${[0,1].map(v=>`<div class="scene" data-side="${v}">${scene(l,v)}</div>`).join('')}</div><p class="muted">The clock begins with your first tap. A wrong tap costs 3 seconds.</p><div class="actions"><button class="btn secondary" id="restart">Restart level</button><button class="btn ghost" id="skip">Choose next level</button></div><div id="result"></div></section>`);$('#restart').onclick=renderDifference;$('#skip').onclick=()=>{level=(level+1)%levels.length;renderDifference()};document.querySelectorAll('.scene').forEach(el=>el.onclick=e=>{if(!game||game.kind!=='difference'||game.found.size===5||$('#result').children.length)return;if(!game.started){game.started=true;timer=setInterval(()=>{if(!game)return;game.left--;$('#time').textContent=game.left;if(game.left<=0)finish('difference',0,`${game.found.size} of 5 differences found`,0,false)},1000)}let rect=el.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100,idx=l.areas.findIndex(([cx,cy,r])=>Math.hypot(x-cx,y-cy*rect.height/rect.width*rect.width/rect.height)<=r);if(idx<0){game.wrong++;game.left=Math.max(1,game.left-3);$('#mistakes').textContent=game.wrong;$('#time').textContent=game.left;sound('bad');el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),300);return}if(game.found.has(idx))return;game.found.add(idx);sound('good');$('#found').textContent=game.found.size;document.querySelectorAll('.scene').forEach(s=>{let marker=document.createElement('i');marker.className='marker';marker.style.left=l.areas[idx][0]+'%';marker.style.top=l.areas[idx][1]+'%';s.append(marker)});if(game.found.size===5){let score=Math.max(100,Math.round((500+game.left*12-game.wrong*45)*l.difficulty));if(game.wrong===0)award('Perfect Difference Round');finish('difference',score,`Found all 5 in ${l.seconds-game.left}s · ${game.wrong} mistakes`,Math.round(60*l.difficulty))}})}function renderMemory(){clear();let pairs=Number(sessionStorage.getItem('pairs')||6),icons=['🐙','🦊','🍋','🚀','🎮','🧩','🌈','🌻','🐼','🛸','🍀','⭐'];let arr=[...icons.slice(0,pairs),...icons.slice(0,pairs)].sort(()=>Math.random()-.5);game={kind:'memory',arr,open:[],matched:new Set(),moves:0,seconds:0,lock:false};view(`<section class="section"><div class="eyebrow">Memory Match</div><h1>Flip. Remember. Match.</h1><p>Find all pairs with as few moves as you can.</p><label>Difficulty <select id="difficulty"><option value="4">Easy · 4 pairs</option><option value="6">Medium · 6 pairs</option><option value="8">Hard · 8 pairs</option></select></label><div class="gamebar section"><span>⏱ <b id="time">0</b>s</span><span>🎯 <b id="moves">0</b> moves</span><span>✨ <b id="pairs">0</b>/${pairs} pairs</span></div><div class="memory-grid">${arr.map((_,i)=>`<button class="tile" data-i="${i}" aria-label="Hidden card ${i+1}">?</button>`).join('')}</div><div class="actions"><button class="btn secondary" id="restart">Restart</button></div><div id="result"></div></section>`);$('#difficulty').value=pairs;$('#difficulty').onchange=e=>{sessionStorage.setItem('pairs',e.target.value);renderMemory()};$('#restart').onclick=renderMemory;document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{let g=game,i=Number(b.dataset.i);if(!g||g.lock||g.matched.has(i)||g.open.includes(i))return;if(!timer)timer=setInterval(()=>{if(game===g)$('#time').textContent=++g.seconds},1000);b.textContent=g.arr[i];b.classList.add('open');g.open.push(i);if(g.open.length===2){g.moves++;$('#moves').textContent=g.moves;let [a,c]=g.open;if(g.arr[a]===g.arr[c]){g.matched.add(a);g.matched.add(c);g.open=[];sound('good');document.querySelectorAll('.tile')[a].classList.add('matched');document.querySelectorAll('.tile')[c].classList.add('matched');$('#pairs').textContent=g.matched.size/2;if(g.matched.size===g.arr.length){let score=Math.max(100,Math.round(pairs*180-g.moves*20-g.seconds*3));finish('memory',score,`${g.moves} moves · ${g.seconds} seconds`,pairs*10)}}else{g.lock=true;sound('bad');timeout=setTimeout(()=>{if(game!==g)return;[a,c].forEach(j=>{let t=document.querySelectorAll('.tile')[j];t.textContent='?';t.classList.remove('open')});g.open=[];g.lock=false},750)}}})}function renderReaction(){clear();game={kind:'reaction',rounds:[],state:'ready',go:0};view(`<section class="section"><div class="eyebrow">Reaction Speed</div><h1>How fast can you tap?</h1><p>Tap to start, wait for green, then tap immediately. Five rounds make your score.</p><div class="gamebar section"><span>Round <b id="round">1</b>/5</span><span>Best: <b id="best">—</b> ms</span></div><button class="reaction" id="react">Tap to start</button><p id="rounds" class="muted">Your results will appear here.</p><div class="actions"><button id="restart" class="btn secondary">Restart test</button></div><div id="result"></div></section>`);$('#restart').onclick=renderReaction;$('#react').onclick=()=>{let g=game;if(!g||g.kind!=='reaction')return;if(g.state==='ready'){g.state='wait';$('#react').className='reaction wait';$('#react').textContent='Wait for green…';timeout=setTimeout(()=>{if(game!==g)return;g.state='go';g.go=performance.now();$('#react').className='reaction go';$('#react').textContent='TAP NOW!';sound('good')},1500+Math.random()*2600)}else if(g.state==='wait'){clearTimeout(timeout);g.state='ready';$('#react').className='reaction';$('#react').textContent='Too soon! Tap to retry';sound('bad')}else if(g.state==='go'){let ms=Math.round(performance.now()-g.go);g.rounds.push(ms);$('#best').textContent=Math.min(...g.rounds);$('#rounds').textContent=g.rounds.map((n,i)=>`Round ${i+1}: ${n} ms`).join(' · ');sound('good');if(g.rounds.length===5){let avg=Math.round(g.rounds.reduce((a,b)=>a+b,0)/5);$('#react').textContent=`Average: ${avg} ms`;$('#react').className='reaction';g.state='done';finish('reaction',avg,`Best ${Math.min(...g.rounds)} ms · Five rounds completed`,Math.max(30,Math.round(150-avg/5)))}else{g.state='ready';$('#round').textContent=g.rounds.length+1;$('#react').className='reaction';$('#react').textContent='Tap for next round'}}}}function start(kind){if(kind==='difference')renderDifference();if(kind==='memory')renderMemory();if(kind==='reaction')renderReaction()}function route(){clear();let page=location.hash.slice(1)||'home';document.title=(page==='home'?'Little games, big moments':page.replace(/-/g,' ')+' · Playmora')+' · Playmora';if(cards.some(c=>c[0]===page)){start(page);return}if(page==='home')view(`<section class="hero"><div><div class="eyebrow">Free little games. Big daily smiles.</div><h1>Your next five minutes just got better.</h1><p>Spot the difference, match your memory, or chase your fastest tap. No account. Just play.</p><a class="btn" href="#difference">Play Find the Difference →</a></div><div class="hero-art" aria-hidden="true">🔎 ✨</div></section><section class="section"><div class="stats"><div class="stat"><strong>${data.plays}</strong>Games played</div><div class="stat"><strong>${data.streak} 🔥</strong>Day streak</div><div class="stat"><strong>${data.xp}</strong>XP earned</div><div class="stat"><strong>${data.achievements.length}</strong>Achievements</div></div></section><section class="section"><div class="eyebrow">The flagship</div><h2>Find five. Feel brilliant.</h2><p>Three original scenes with five deliberate changes each. Tap either image to find them all.</p><a class="btn" href="#difference">Start spotting →</a></section><section class="section"><h2>Pick your next game</h2><div class="grid">${cards.map(card).join('')}</div></section><section class="section panel"><div class="eyebrow">A fresh challenge every day</div><h2>Keep the streak alive 🔥</h2><p>One featured game rotates daily. Finish it to collect a daily XP bonus.</p><a class="btn" href="#daily">Today's challenge →</a></section>`);else if(page==='games')view(`<section class="section"><div class="eyebrow">Choose your adventure</div><h1>Games for your brain break.</h1><div class="grid">${cards.map(card).join('')}</div></section>`);else if(page==='daily'){let index=Math.floor(Date.parse(today()+'T12:00:00')/86400000)%3,c=cards[index];view(`<section class="section"><div class="eyebrow">Today's challenge · ${today()}</div><h1>${c[1]} ${c[2]}</h1><p>${data.daily[today()]?'Completed today! Come back tomorrow.':'Complete today’s featured game for 50 bonus XP.'}</p><a class="btn" id="daily-start" href="#${c[0]}">Play challenge →</a><p>Current streak: ${data.streak} days</p></section>`);$('#daily-start').onclick=()=>sessionStorage.setItem('daily-play',c[0])}else if(page==='profile'){let lvl=1+Math.floor(data.xp/300);view(`<section class="section"><div class="eyebrow">Your progress · stored on this device</div><h1>Keep growing, ${safe(data.nickname||'player')}.</h1><label>Nickname <input id="nickname" maxlength="24" value="${safe(data.nickname||'')}" placeholder="Your nickname"></label><button class="btn secondary" id="save-name">Save</button><div class="stats section"><div class="stat"><strong>${lvl}</strong>Level</div><div class="stat"><strong>${data.xp}</strong>XP</div><div class="stat"><strong>${data.streak}</strong>Day streak</div><div class="stat"><strong>${data.plays}</strong>Games</div></div><p>Next level: ${300-data.xp%300} XP away</p><div class="progress"><i style="width:${data.xp%300/3}%"></i></div><h2>Personal bests</h2><div class="grid">${cards.map(c=>`<div class="panel"><strong>${c[2]}</strong><p>${data.bests[c[0]]??'No result yet'}${c[0]==='reaction'&&data.bests.reaction!=null?' ms':''}</p></div>`).join('')}</div><h2>Achievements</h2><p>${data.achievements.map(a=>`<span class="badge">🏆 ${safe(a)}</span>`).join('')||'Play a game to unlock your first badge.'}</p><h2>Recent results</h2><p>${data.results.slice(0,8).map(r=>`<span class="badge">${safe(r.kind)} · ${r.score} · ${r.date}</span>`).join('')||'No games played yet.'}</p></section>`);$('#save-name').onclick=()=>{data.nickname=$('#nickname').value.trim();save();toast('Nickname saved')}}else if(page==='leaderboard'){view(`<section class="section"><div class="eyebrow">On this device only</div><h1>Your local leaderboard.</h1><p>These are your actual scores saved in this browser. Global rankings are planned for a future version.</p><div class="actions"><select id="period"><option>Today</option><option>This Week</option><option>All Time</option></select><select id="filter"><option value="all">All games</option>${cards.map(c=>`<option value="${c[0]}">${c[2]}</option>`).join('')}</select></div><div id="ranks"></div></section>`);function rank(){let p=$('#period').value,f=$('#filter').value,now=Date.parse(today()+'T12:00:00');let rows=data.results.filter(r=>(f==='all'||r.kind===f)&&(p==='All Time'||(now-Date.parse(r.date+'T12:00:00'))<(p==='Today'?86400000:7*86400000))).sort((a,b)=>a.kind===b.kind&&a.kind==='reaction'?a.score-b.score:b.score-a.score);$('#ranks').innerHTML=rows.length?rows.slice(0,20).map((r,i)=>`<div class="panel" style="margin:9px 0">#${i+1} · ${safe(data.nickname||'You')} · ${safe(r.kind)} · <b>${r.score}${r.kind==='reaction'?' ms':''}</b> · ${r.date}</div>`).join(''):'<p>No scores for this selection yet. Play a game to set one!</p>'}$('#period').onchange=rank;$('#filter').onchange=rank;rank()}else{let pages={about:['About Playmora','Playmora offers three free, original browser games. Your progress lives in this browser, with no registration required.'],contact:['Contact','For questions or feedback, use the contact details supplied by the site owner when this website launches.'],privacy:['Privacy Policy','Game progress, optional nickname, preferences and scores are stored in your browser using localStorage. No account, database, advertising or analytics is used. We do not receive your local game data. You can delete it through your browser site-data controls. Hosting providers may process technical requests under their own policies.'],cookies:['Cookies & Analytics','Playmora uses localStorage to remember progress and sound settings. It does not set its own cookies or run analytics or advertising scripts. Browser and hosting infrastructure may handle technical data.']};let [title,copy]=pages[page]||['Page not found','This page does not exist.'];view(`<section class="section"><h1>${title}</h1><p>${copy}</p><a href="#home" class="btn">Back to games</a></section>`)}}window.addEventListener('hashchange',route);$('#sound').onclick=()=>{data.sound=!data.sound;save()};save();route();
</script></body></html>
